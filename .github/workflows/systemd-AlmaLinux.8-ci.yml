---
# Generated by src/systemd/generate.py
name: "AlmaLinux.8 - systemd"

'on':
  pull_request:
    paths:
      - "Containerfiles/systemd/AlmaLinux/AlmaLinux.8.Containerfile"
      - ".github/workflows/systemd-AlmaLinux.8-ci.yml"
      - ".github/workflows/reusable-container-build.yml"
  push:
    branches:
      - main
    paths:
      - "Containerfiles/systemd/AlmaLinux/AlmaLinux.8.Containerfile"
      - ".github/workflows/systemd-AlmaLinux.8-ci.yml"
      - ".github/workflows/reusable-container-build.yml"
  schedule:
    - cron: "10 1 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_push:
    name: Build and Push container images to quay.io
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      context: "./Containerfiles/systemd/AlmaLinux"
      containerfile: "./Containerfiles/systemd/AlmaLinux/AlmaLinux.8.Containerfile"
      platforms: "linux/amd64,linux/arm64"
      image_title: "AlmaLinux image with systemd"
      image_description: "AlmaLinux image with systemd for Ansible testing using Podman and Molecule"
      project_path: "Containerfiles/systemd"
      documentation_path: "Containerfiles/systemd/README.md"
      tags: |
        quay.io/gotmax23/almalinux-systemd:8
        quay.io/gotmax23/el-systemd:8
    secrets:
      registry_username: ${{ secrets.QUAY_USERNAME }}
      registry_password: ${{ secrets.QUAY_PASSWORD }}
