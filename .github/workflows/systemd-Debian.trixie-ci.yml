---
# Generated by src/systemd/generate.py
name: "Debian.trixie - systemd"

'on':
  push:
    branches:
      - main
    paths:
      - "Containerfiles/systemd/Debian/Debian.trixie.Containerfile"
      - ".github/workflows/systemd-Debian.trixie-ci.yml"
      - ".github/workflows/reusable-container-build.yml"
  schedule:
    - cron: "10 1 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_push:
    name: Build and Push container images to quay.io
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      context: "./Containerfiles/systemd/Debian"
      containerfile: "./Containerfiles/systemd/Debian/Debian.trixie.Containerfile"
      platforms: "linux/amd64,linux/arm64"
      image_title: "Debian image with systemd"
      image_description: "Debian image with systemd for Ansible testing using Podman and Molecule"
      project_path: "Containerfiles/systemd"
      documentation_path: "Containerfiles/systemd/README.md"
      tags: |
        quay.io/gotmax23/debian-systemd:trixie
        quay.io/gotmax23/debian-systemd:latest
        quay.io/gotmax23/debian-systemd:stable
        quay.io/gotmax23/debian-systemd:13
    secrets:
      registry_username: ${{ secrets.QUAY_USERNAME }}
      registry_password: ${{ secrets.QUAY_PASSWORD }}
