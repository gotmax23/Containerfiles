---
name: Build and push container

'on':
  workflow_call:
    inputs:
      context:
        description: Build context
        required: true
        type: string
      containerfile:
        description: Containerfile path
        required: true
        type: string
      platforms:
        description: Comma-separated target platforms
        required: true
        type: string
      tags:
        description: Newline-separated image tags
        required: true
        type: string
      image_title:
        description: OCI image title
        required: true
        type: string
      image_description:
        description: OCI image description
        required: true
        type: string
      project_path:
        description: Repository path containing the image sources
        required: true
        type: string
      documentation_path:
        description: Repository path to the image documentation
        required: true
        type: string
      registry:
        description: Container registry hostname
        default: quay.io
        required: false
        type: string
    secrets:
      registry_username:
        required: true
      registry_password:
        required: true

permissions:
  contents: read

jobs:
  build_push:
    name: Build and Push container images to ${{ inputs.registry }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Calculate image metadata
        id: metadata
        shell: bash
        run: |
          case $GITHUB_REF in
            refs/tags/*)  VERSION=${GITHUB_REF#refs/tags/};;
            refs/heads/*) VERSION=$(echo "${GITHUB_REF#refs/heads/}" | sed -r 's#/+#-#g');;
            refs/pull/*)  VERSION=pr-${{ github.event.number }};;
            *)            VERSION=sha-${GITHUB_SHA::8};;
          esac
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "build_date=$(git show -s --format=%cI)" >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Login to ${{ inputs.registry }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_password }}
      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.containerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          labels: |
            org.opencontainers.image.title=${{ inputs.image_title }}
            org.opencontainers.image.description=${{ inputs.image_description }}
            org.opencontainers.image.url=${{ github.event.repository.html_url }}/tree/main/${{ inputs.project_path }}
            org.opencontainers.image.documentation=${{ github.event.repository.html_url }}/tree/main/${{ inputs.documentation_path }}
            org.opencontainers.image.source=${{ github.event.repository.clone_url }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
            org.opencontainers.image.created=${{ steps.metadata.outputs.build_date }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id }}
          tags: ${{ inputs.tags }}
