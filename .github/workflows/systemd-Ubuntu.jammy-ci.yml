---
# Generated by src/systemd/generate.py
name: "Ubuntu.jammy - systemd"

'on':
  pull_request:
    paths:
      - "Containerfiles/systemd/Ubuntu/Ubuntu.jammy.Containerfile"
      - ".github/workflows/systemd-Ubuntu.jammy-ci.yml"
      - ".github/workflows/reusable-container-build.yml"
  push:
    branches:
      - main
    paths:
      - "Containerfiles/systemd/Ubuntu/Ubuntu.jammy.Containerfile"
      - ".github/workflows/systemd-Ubuntu.jammy-ci.yml"
      - ".github/workflows/reusable-container-build.yml"
  schedule:
    - cron: "10 1 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_push:
    name: Build and Push container images to quay.io
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-container-build.yml
    with:
      context: "./Containerfiles/systemd/Ubuntu"
      containerfile: "./Containerfiles/systemd/Ubuntu/Ubuntu.jammy.Containerfile"
      platforms: "linux/amd64,linux/arm64"
      image_title: "Ubuntu image with systemd"
      image_description: "Ubuntu image with systemd for Ansible testing using Podman and Molecule"
      project_path: "Containerfiles/systemd"
      documentation_path: "Containerfiles/systemd/README.md"
      tags: |
        quay.io/gotmax23/ubuntu-systemd:jammy
        quay.io/gotmax23/ubuntu-systemd:22.04
    secrets:
      registry_username: ${{ secrets.QUAY_USERNAME }}
      registry_password: ${{ secrets.QUAY_PASSWORD }}
