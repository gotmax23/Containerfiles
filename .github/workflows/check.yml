---
name: Checks

'on':
  pull_request:
    paths:
      - ".github/**"
      - "Containerfiles/systemd/**"
      - "src/systemd/**"
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - "Containerfiles/systemd/**"
      - "src/systemd/**"

permissions:
  contents: read

jobs:
  checks:
    name: Generator and workflow checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Run checks
        run: uv run --locked --group nox nox
        working-directory: src/systemd
