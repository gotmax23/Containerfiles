---
# Generated by src/systemd/generate.py
name: "RockyLinux.10 - systemd"

'on':
  pull_request:
    paths:
      - "Containerfiles/systemd/RockyLinux/RockyLinux.10.Containerfile"
      - ".github/workflows/systemd-RockyLinux.10-ci.yml"
      - ".github/workflows/reusable-container-build.yml"
  push:
    branches:
      - main
    paths:
      - "Containerfiles/systemd/RockyLinux/RockyLinux.10.Containerfile"
      - ".github/workflows/systemd-RockyLinux.10-ci.yml"
      - ".github/workflows/reusable-container-build.yml"
  schedule:
    - cron: "10 1 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_push:
    name: Build and Push container images to quay.io
    permissions:
      contents: read
    uses: $/.github/workflows/reusable-container-build.yml
    with:
      context: "./Containerfiles/systemd/RockyLinux"
      containerfile: "./Containerfiles/systemd/RockyLinux/RockyLinux.10.Containerfile"
      platforms: "linux/amd64,linux/arm64"
      image_title: "RockyLinux image with systemd"
      image_description: "RockyLinux image with systemd for Ansible testing using Podman and Molecule"
      project_path: "Containerfiles/systemd"
      documentation_path: "Containerfiles/systemd/README.md"
      tags: |
        quay.io/gotmax23/rockylinux-systemd:10
        quay.io/gotmax23/rockylinux-systemd:latest
        quay.io/gotmax23/rocky-systemd:10
        quay.io/gotmax23/rocky-systemd:latest
    secrets:
      registry_username: ${{ secrets.QUAY_USERNAME }}
      registry_password: ${{ secrets.QUAY_PASSWORD }}
