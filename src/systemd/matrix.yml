---
# Variables are resolved in this order, with later levels taking precedence:
# defaults, distro family, distro, output.
type: systemd

defaults:
  vars:
    python_version: "3"
    docker_cmd: "/sbin/init"
    docker_stopsignal: "SIGRTMIN+3"
    docker_platforms:
      - linux/amd64
      - linux/arm64
    default_packages:
      - systemd
      - "python{python_version}"
      - sudo
      - ca-certificates
    baseimage: null
    extra_ci_image_tags: []
    extra_ci_image_repos: []
    build_cron: "10 1 * * 0"
    update_ms: false
    masked_services:
      - systemd-remount-fs.service
      - dev-hugepages.mount
      - sys-fs-fuse-connections.mount
      # - systemd-logind.service
      - getty.target
      - console-getty.service
      - systemd-udev-trigger.service
      - systemd-udevd.service
      - systemd-random-seed.service
      - systemd-machine-id-commit.service
    extra_masked_services: []
    extra_commands: []
    gha_workflow: true

distro_families:
  Debian:
    vars:
      package_mgr_name: apt
      package_mgr_install_cmd: >
        apt-get update &&
        apt-get upgrade -y --no-install-recommends &&
        apt-get install -y --no-install-recommends
      package_mgr_clean_cmd: "apt-get clean"
      packages:
        - systemd-sysv
        - python3-apt

  RedHat:
    vars:
      package_mgr_name: dnf
      package_mgr_install_cmd: "dnf upgrade -y --nodoc && dnf install -y --nodoc"
      package_mgr_clean_cmd: "{package_mgr_name} clean all"
      packages: []

  Suse:
    vars:
      package_mgr_name: zypper
      package_mgr_install_cmd: "zypper update -y && zypper install -y"
      package_mgr_clean_cmd: "zypper clean"
      packages: []

  Archlinux:
    vars:
      package_mgr_name: pacman
      package_mgr_install_cmd: "pacman -Syu --noconfirm && pacman -S --needed --noconfirm"
      package_mgr_clean_cmd: "pacman -Scc"
      packages:
        - systemd-sysvcompat
      extra_masked_services:
        - systemd-firstboot.service

##########

distros:
  - name: Archlinux
    distro_family: Archlinux
    vars:
      baseimage: docker.io/archlinux/archlinux:base-devel
      baseimage_repo: ''
    outputs:
      - baseimage_version: any
        vars:
          docker_platforms:
            - linux/amd64
          extra_ci_image_tags:
            - "latest"
          build_cron: "10 1 * * *"

  - name: Debian
    distro_family: Debian
    vars:
      baseimage_repo: docker.io/library/debian
    outputs:
      - baseimage_version: bullseye
        vars:
          extra_ci_image_tags:
            - "11"
      - baseimage_version: bookworm
        vars:
          extra_ci_image_tags:
            - "oldstable"
            - "12"
      - baseimage_version: trixie
        vars:
          extra_ci_image_tags:
            - "latest"
            - "stable"
            - "13"
      - baseimage_version: forky
        vars:
          extra_ci_image_tags:
            - "testing"
            - "14"

  - name: RedHat
    distro_family: RedHat
    vars:
      baseimage_repo: ''  # This variable is not used for the UBI-based images"
    outputs:
      - baseimage_version: 8
        vars:
          baseimage: "registry.access.redhat.com/ubi8:latest"
          extra_ci_image_tags:
            - "latest"

  - name: CentOS
    distro_family: RedHat
    vars:
      baseimage_repo: "quay.io/centos/centos"
      update_ms: true
    outputs:
      - baseimage_version: stream9
        vars:
          update_ms: false
      - baseimage_version: stream10
        vars:
          update_ms: false
          extra_ci_image_tags:
            - "latest"


  - name: AlmaLinux
    distro_family: RedHat
    vars:
      baseimage_repo: "docker.io/library/almalinux"
    outputs:
      - baseimage_version: 8
        vars:
          extra_ci_image_repos:
            - "quay.io/gotmax23/el-systemd:8"
      - baseimage_version: 9
        vars:
          extra_ci_image_repos:
            - "quay.io/gotmax23/el-systemd:9"
      - baseimage_version: 10
        vars:
          extra_ci_image_tags:
            - "latest"
          extra_ci_image_repos:
            - "quay.io/gotmax23/el-systemd:10"
            - "quay.io/gotmax23/el-systemd:latest"

  - name: Fedora
    distro_family: RedHat
    vars:
      baseimage_repo: registry.fedoraproject.org/fedora
      package_mgr_install_cmd: "dnf upgrade -y --setopt=tsflags=nodocs && dnf install -y --setopt=tsflags=nodocs"
    outputs:
      - baseimage_version: 44
        vars:
          extra_ci_image_tags:
            - "latest"
      - baseimage_version: 45
      - baseimage_version: 46
        vars:
          extra_ci_image_tags:
            - "rawhide"

  - name: opensuse
    distro_family: Suse
    vars:
      baseimage_repo: registry.opensuse.org/opensuse/leap
    outputs:
      - baseimage_version: 16
        vars:
          extra_ci_image_tags:
            - "latest"
          extra_ci_image_repos:
            - "quay.io/gotmax23/opensuse-leap-systemd:16"
            - "quay.io/gotmax23/opensuse-leap-systemd:latest"
      - baseimage_version: tumbleweed
        vars:
          baseimage: registry.opensuse.org/opensuse/tumbleweed
          extra_ci_image_repos:
            - "quay.io/gotmax23/opensuse-tumbleweed-systemd:latest"
          build_cron: "10 1 * * *"

  - name: SLES
    distro_family: Suse
    vars:
      baseimage_repo: registry.suse.com/suse/sle15
    outputs:
      - baseimage_version: 15.7
        vars:
          extra_ci_image_tags:
            - "15"
      - baseimage_version: 16.0
        vars:
          baseimage: registry.suse.com/bci/bci-base:16.0
          extra_ci_image_tags:
            - "latest"
            - "16"

  - name: Ubuntu
    distro_family: Debian
    vars:
      baseimage_repo: docker.io/library/ubuntu
    outputs:
      - baseimage_version: jammy
        vars:
          extra_ci_image_tags:
            - "22.04"
      - baseimage_version: noble
        vars:
          extra_ci_image_tags:
            - "24.04"
            - "latest"
      - baseimage_version: resolute
        vars:
          extra_ci_image_tags:
            - "26.04"
